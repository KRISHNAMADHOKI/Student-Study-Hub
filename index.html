<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Student Study Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>📚 Student Study Hub</h1>

  <p>Welcome! Apni padhai ko organize karo.</p>

  <h2>📖 My Subjects</h2>

  <ul>
    <li>Hindi</li>
    <li>English</li>
    <li>History</li>
    <li>Political Science</li>
  </ul>

  <h2>⏱️ Study Timer</h2>

  <div id="timer">25:00</div>

  <button id="startTimer">Start Study</button>
  <button id="resetTimer">Reset</button>

  <h2>✅ My Tasks</h2>

  <input type="text" id="taskInput" placeholder="Apna task likho">
  <button id="addTask">Add Task</button>

  <ul id="taskList"></ul>

  <script src="script.js"></script>
</body>
</html>
